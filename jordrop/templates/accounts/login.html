{% extends "base.html" %}
{% block title %}Login — JORDROP{% endblock %}
{% block content %}
<style>
.auth-wrap { max-width: 420px; margin: 4rem auto; }
.auth-title { font-family:'Orbitron',monospace;font-size:1.5rem;font-weight:700;color:var(--accent);margin-bottom:2rem; }
</style>
<div class="auth-wrap">
  <div class="auth-title">Login</div>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">
      <label>{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="btn" style="width:100%;justify-content:center;padding:0.875rem">Sign In</button>
  </form>
  <p style="margin-top:1.5rem;text-align:center;font-size:0.85rem;color:var(--muted)">
    No account? <a href="/accounts/register/" style="color:var(--accent)">Register →</a>
  </p>
</div>
{% endblock %}
